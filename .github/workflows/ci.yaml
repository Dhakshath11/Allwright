name: CI Pipeline

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  security-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Re-add `actions: read` and `security-events: write` when CodeQL is
      # re-enabled (see commented block below).

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      # CodeQL — disabled until Code Scanning is enabled on the repo.
      # To re-enable: GitHub repo → Settings → Code security → Code scanning
      # → Set up → Advanced. Then uncomment the steps below and the
      # `actions: read` / `security-events: write` permissions above.
      # - name: Initialize CodeQL
      #   uses: github/codeql-action/init@v3
      #   with:
      #     languages: javascript-typescript
      #
      # - name: Autobuild
      #   uses: github/codeql-action/autobuild@v3
      #
      # - name: Analyze
      #   uses: github/codeql-action/analyze@v3
